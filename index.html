<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Results summary component</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section class="card">
        <div class="card-header">
          <h1>Your Result</h1>
          <div class="result-circle">
            <p>76</p>
            <p>of 100</p>
          </div>
          <div class="result-text">
            <p>Great</p>
            <p>
              You scored higher than 65% of the people who have taken these
              tests.
            </p>
          </div>
        </div>
        <div class="card-body">
          <h2>Summary</h2>
          <div class="spec">
            <img src="./assets/images/icon-reaction.svg" alt="icon-reaction" />
            <p>Reaction</p>
            <p>80 / 100</p>
          </div>
          <div class="spec">
            <img src="./assets/images/icon-memory.svg" alt="icon-memory" />
            <p>Memory</p>
            <p>92 / 100</p>
          </div>
          <div class="spec">
            <img src="./assets/images/icon-verbal.svg" alt="icon-verbal" />
            <p>Verbal</p>
            <p>61 / 100</p>
          </div>
          <div class="spec">
            <img src="./assets/images/icon-visual.svg" alt="icon-visual" />
            <p>Visual</p>
            <p>72 / 100</p>
          </div>
          <button>Continue</button>
        </div>
      </section>
    </main>
  </body>
</html>
